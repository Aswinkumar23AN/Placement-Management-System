<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">

            <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
                🎓 Placement Management System
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('home') }}">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('add_student') }}">Add Student</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('view_students') }}">View Students</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('search_student') }}">Search</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('update_student') }}">Update</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('delete_student') }}">Delete</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{{ url_for('eligible_students') }}">
                            Eligible Students
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <div class="container mt-5">

        {% block content %}

        {% endblock %}

    </div>

    <!-- Footer -->
    <footer class="text-center mt-5 mb-3 text-secondary">
        <hr>
        <p>&copy; 2026 Placement Management System | Developed using Flask & MySQL</p>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
