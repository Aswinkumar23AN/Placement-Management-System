{% extends "layout.html" %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow-lg">

            <div class="card-header bg-primary text-white text-center">
                <h2>Add Student</h2>
            </div>

            <div class="card-body">

                <form action="{{ url_for('add_student') }}" method="POST">

                    <div class="mb-3">
                        <label class="form-label">Roll Number</label>
                        <input
                            type="number"
                            name="rollno"
                            class="form-control"
                            placeholder="Enter Roll Number"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Student Name</label>
                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter Student Name"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>

                        <select
                            name="department"
                            class="form-select"
                            required>

                            <option value="">Select Department</option>

                            <option>CSE</option>
                            <option>IT</option>
                            <option>ECE</option>
                            <option>EEE</option>
                            <option>MECH</option>
                            <option>CIVIL</option>

                        </select>

                    </div>

                    <div class="mb-3">
                        <label class="form-label">CGPA</label>

                        <input
                            type="number"
                            step="0.01"
                            min="0"
                            max="10"
                            name="cgpa"
                            class="form-control"
                            placeholder="Enter CGPA"
                            required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Skills</label>

                        <textarea
                            name="skills"
                            rows="3"
                            class="form-control"
                            placeholder="Example: Python, SQL, Java"></textarea>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Placement Status
                        </label>

                        <select
                            name="placement_status"
                            class="form-select"
                            required>

                            <option value="">Select Status</option>

                            <option>Placed</option>
                            <option>Not Placed</option>

                        </select>

                    </div>

                    <div class="d-grid">

                        <button
                            type="submit"
                            class="btn btn-success btn-lg">

                            Add Student

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
